{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
  <li>
    <a href="{% url 'admin:shop_product_export_price_list' %}" class="sib-btn-action primary" style="background: linear-gradient(135deg, #10b981, #059669); color: white; font-weight: 700; border-radius: 6px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;" title="Скачать актуальный прайс-лист для всех устройств (.xlsx, UTF-8)">
      <i class="bi bi-file-earmark-excel-fill"></i> Экспорт прайс-листа (.xlsx)
    </a>
  </li>
  <li>
    <a href="{% url 'admin:shop_product_import_price_list' %}" class="sib-btn-action" style="background: linear-gradient(135deg, #ff8400, #ea580c); color: white; font-weight: 700; border-radius: 6px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;" title="Загрузить обновленный Excel файл с ценами">
      <i class="bi bi-file-earmark-arrow-up-fill"></i> Импорт цен (.xlsx)

  </li>
  {{ block.super }}
{% endblock %}
